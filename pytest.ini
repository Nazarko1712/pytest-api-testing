[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Imports resolve from the repository root, so `from src.client import ...`
# works without installing the package or fiddling with sys.path.
pythonpath = .

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

# --strict-markers turns a typo in @pytest.mark.smoek into an ERROR rather than
# a silently ignored marker on a test.
#
# IMPORTANT and easy to get wrong: it does NOT validate the -m EXPRESSION.
# `pytest -m smoek` still exits 0 with "40 deselected" — a typo on the command
# line or in a CI job silently runs nothing and reports success. Guard that in
# CI by asserting a minimum collected count, not by trusting strict-markers.

markers =
    smoke: minimal checks that must always pass
    defect: documents a known API defect
    slow: makes several sequential calls

filterwarnings =
    error
    ignore::DeprecationWarning:jsonschema.*

# `error` promotes warnings to failures: a DeprecationWarning from a dependency
# is a future breakage, and the only time it is cheap to fix is now.
